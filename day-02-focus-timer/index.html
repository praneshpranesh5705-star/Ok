<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <p class="eyebrow">DAY 02 PROJECT</p>
      <h1>Focus Timer</h1>
      <p class="subtitle">A simple Pomodoro timer for focused study sessions.</p>
      <div class="timer" id="timer">25:00</div>
      <div class="mode-row">
        <button class="mode active" data-minutes="25">Focus</button>
        <button class="mode" data-minutes="5">Short break</button>
        <button class="mode" data-minutes="15">Long break</button>
      </div>
      <div class="controls">
        <button class="primary" id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>
      <div class="stats">
        <div><strong id="sessions">0</strong><span>sessions</span></div>
        <div><strong id="minutesDone">0</strong><span>minutes focused</span></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
