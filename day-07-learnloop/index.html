<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnLoop</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><p class="eyebrow">DAY 07 • EDUCATION APP</p><h1>LearnLoop</h1><p>Build a daily learning habit with quick flashcards, progress tracking, and your own study deck.</p><div class="stats"><div><strong id="reviewed">0</strong><span>Reviewed</span></div><div><strong id="streak">0</strong><span>Easy streak</span></div><div><strong id="position">1 / 3</strong><span>Current card</span></div></div><section class="panel"><h2 id="question">What does HTML stand for?</h2><button id="show">Reveal answer</button><p id="answer"></p><div class="progress"><span id="progress"></span></div><div class="actions"><button data-next="Again">Again</button><button data-next="Good">Good</button><button data-next="Easy">Easy</button><button id="next" class="secondary">Next</button></div></section><form id="form" class="panel"><h2>Add a card</h2><input id="q" placeholder="Question" required><input id="a" placeholder="Answer" required><button type="submit">Add card</button></form><section class="panel"><h2>Your deck</h2><div id="list"></div></section></main><script src="script.js"></script></body></html>
