<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CropCare Planner</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div><p class="eyebrow">DAY 9 • SMART FARMING</p><h1>CropCare Planner 🌱</h1><p class="sub">Plan simple crop-care tasks from sowing to harvest.</p></div><button id="clear">Clear All</button></header>
<section class="grid"><form id="form" class="card"><h2>Add a crop plan</h2><label>Crop<select id="crop"><option>Tomato</option><option>Chilli</option><option>Banana</option><option>Rice</option><option>Groundnut</option></select></label><label>Planting date<input id="date" type="date" required></label><label>Field size (acres)<input id="acres" type="number" min="0.1" step="0.1" value="1"></label><button class="primary">Create Plan</button></form>
<section class="card"><div class="row"><h2>Upcoming care</h2><span id="total" class="pill">0 tasks</span></div><div id="tasks" class="tasks"><div class="empty">Add a crop to generate its care calendar.</div></div></section></section>
<section class="card tips"><h2>Quick field checklist</h2><div class="checks"><label><input type="checkbox"> Check soil moisture</label><label><input type="checkbox"> Inspect leaves for pests</label><label><input type="checkbox"> Record field observations</label><label><input type="checkbox"> Review irrigation need</label></div></section></main><script src="script.js"></script></body></html>
